# ws_bridge node parameters.
# The node also reads the same values from the environment (see ws_bridge/config.py).
# Prefer the environment so one .env controls the whole deployment.
ws_bridge:
  ros__parameters:
    ws_host: "0.0.0.0"
    ws_port: 3001
    ee_link: "panda_hand"
    move_group: "panda_arm"
    traj_controller: "joint_trajectory_controller"
