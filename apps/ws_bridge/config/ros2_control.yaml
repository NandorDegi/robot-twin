# ros2_control configuration for the Franka Panda.
# This is a template. The joint names and the controller type must match your
# franka_ros2 install / URDF. Load it from the launch or the controller_manager.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
